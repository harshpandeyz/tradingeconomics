<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Global Economic Explorer</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <style>
    :root {
      --bg: #0f1117;
      --card: #1a1d27;
      --card-strong: #202432;
      --accent: #00d4aa;
      --accent-soft: rgba(0, 212, 170, 0.14);
      --text: #ffffff;
      --muted: #aab0bf;
      --muted-strong: #d8dce7;
      --border: rgba(255, 255, 255, 0.09);
      --border-strong: rgba(255, 255, 255, 0.14);
      --danger: #ff6b6b;
      --danger-soft: rgba(255, 107, 107, 0.1);
      --shadow: 0 24px 70px rgba(0, 0, 0, 0.36);
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      background: var(--bg);
      color: var(--text);
      font-family: "Inter", system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      overflow-x: hidden;
    }

    .page {
      width: min(1120px, calc(100% - 32px));
      margin: 0 auto;
      padding: 56px 0;
    }

    header {
      display: grid;
      gap: 10px;
      margin-bottom: 36px;
      padding-bottom: 24px;
      border-bottom: 1px solid var(--border);
    }

    h1,
    h2,
    h3,
    p {
      margin: 0;
    }

    h1 {
      max-width: 820px;
      font-size: clamp(2.4rem, 6vw, 4.8rem);
      line-height: 1;
      letter-spacing: 0;
      text-wrap: balance;
      overflow-wrap: anywhere;
    }

    .subtitle {
      color: var(--muted);
      font-size: clamp(1rem, 2vw, 1.2rem);
    }

    .author {
      color: var(--muted-strong);
      font-weight: 600;
    }

    main {
      display: grid;
      gap: 28px;
    }

    .feature {
      background:
        linear-gradient(180deg, rgba(255, 255, 255, 0.04), rgba(255, 255, 255, 0.01)),
        var(--card);
      border: 1px solid var(--border);
      border-radius: 8px;
      box-shadow: var(--shadow);
      padding: clamp(20px, 3vw, 28px);
      min-width: 0;
    }

    .feature-header {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 16px;
      margin-bottom: 24px;
    }

    .feature-title {
      display: grid;
    }

    h2 {
      font-size: clamp(1.35rem, 2.5vw, 2rem);
      letter-spacing: 0;
    }

    .badge {
      flex: 0 0 auto;
      border: 1px solid rgba(0, 212, 170, 0.35);
      background: var(--accent-soft);
      color: var(--accent);
      border-radius: 999px;
      padding: 8px 12px;
      font-size: 0.78rem;
      font-weight: 700;
      white-space: nowrap;
    }

    .controls {
      display: grid;
      grid-template-columns: repeat(4, minmax(0, 1fr));
      gap: 16px;
      align-items: end;
      margin-bottom: 18px;
      width: 100%;
      min-width: 0;
    }

    .controls.history-controls {
      grid-template-columns: repeat(3, minmax(0, 1fr));
    }

    label {
      display: grid;
      gap: 8px;
      color: var(--muted-strong);
      font-size: 0.9rem;
      font-weight: 600;
      min-width: 0;
    }

    select,
    button {
      display: block;
      width: 100%;
      max-width: 100%;
      min-width: 0;
      min-height: 48px;
      border: 1px solid var(--border);
      border-radius: 8px;
      font: inherit;
    }

    select {
      appearance: none;
      background:
        linear-gradient(45deg, transparent 50%, var(--accent) 50%),
        linear-gradient(135deg, var(--accent) 50%, transparent 50%),
        var(--card-strong);
      background-position:
        calc(100% - 18px) 20px,
        calc(100% - 12px) 20px,
        0 0;
      background-size: 6px 6px, 6px 6px, 100%;
      background-repeat: no-repeat;
      color: var(--text);
      padding: 0 42px 0 14px;
      outline: none;
      transition: border-color 180ms ease, box-shadow 180ms ease, background-color 180ms ease;
    }

    select:hover {
      border-color: var(--border-strong);
      background-color: #242938;
    }

    select:focus-visible {
      border-color: rgba(0, 212, 170, 0.75);
      box-shadow: 0 0 0 4px rgba(0, 212, 170, 0.12);
    }

    button {
      cursor: pointer;
      border-color: transparent;
      background: var(--accent);
      color: #07120f;
      font-weight: 800;
      box-shadow: 0 14px 32px rgba(0, 212, 170, 0.18);
      transition: transform 180ms ease, filter 180ms ease, box-shadow 180ms ease;
    }

    button:hover:not(:disabled) {
      filter: brightness(1.08);
      transform: translateY(-1px);
      box-shadow: 0 18px 38px rgba(0, 212, 170, 0.22);
    }

    button:focus-visible {
      outline: none;
      box-shadow:
        0 0 0 4px rgba(0, 212, 170, 0.18),
        0 16px 36px rgba(0, 212, 170, 0.22);
    }

    button:disabled {
      cursor: wait;
      opacity: 0.72;
      transform: none;
      box-shadow: none;
    }

    .status {
      min-height: 28px;
      color: var(--muted);
      font-weight: 600;
      line-height: 1.5;
      margin-bottom: 14px;
    }

    .status.error {
      color: var(--danger);
      width: fit-content;
      max-width: 100%;
      border: 1px solid rgba(255, 107, 107, 0.22);
      border-radius: 8px;
      background: var(--danger-soft);
      padding: 10px 12px;
    }

    .loading {
      display: inline-flex;
      align-items: center;
      gap: 10px;
    }

    .spinner {
      width: 16px;
      height: 16px;
      border: 2px solid rgba(255, 255, 255, 0.2);
      border-top-color: var(--accent);
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }

    .chart-shell {
      display: none;
      position: relative;
      height: 390px;
      width: 100%;
      border: 1px solid var(--border);
      border-radius: 8px;
      background: rgba(15, 17, 23, 0.58);
      padding: 18px;
      opacity: 0;
      transform: translateY(8px);
      pointer-events: none;
    }

    canvas {
      max-width: 100%;
    }

    .chart-shell.visible {
      display: block;
      animation: fadeIn 420ms ease forwards;
      pointer-events: auto;
    }

    .cards {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 16px;
      margin-top: 16px;
    }

    .country-card {
      display: grid;
      gap: 12px;
      border: 1px solid var(--border);
      border-radius: 8px;
      background:
        linear-gradient(180deg, rgba(255, 255, 255, 0.025), transparent),
        var(--card-strong);
      padding: 18px;
      opacity: 0;
      transform: translateY(8px);
    }

    .country-card.visible {
      animation: fadeIn 420ms ease forwards;
    }

    .country-card h3 {
      color: var(--accent);
      font-size: 1.1rem;
    }

    .metric-grid {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 12px;
    }

    .metric {
      display: grid;
      gap: 5px;
    }

    .metric span {
      color: var(--muted);
      font-size: 0.78rem;
      font-weight: 700;
      text-transform: uppercase;
    }

    .metric strong {
      color: var(--text);
      font-size: 1rem;
      overflow-wrap: anywhere;
    }

    @media (prefers-reduced-motion: reduce) {
      *,
      *::before,
      *::after {
        animation-duration: 0.01ms !important;
        animation-iteration-count: 1 !important;
        scroll-behavior: auto !important;
        transition-duration: 0.01ms !important;
      }
    }

    @keyframes spin {
      to {
        transform: rotate(360deg);
      }
    }

    @keyframes fadeIn {
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    @media (max-width: 920px) {
      .controls,
      .controls.history-controls {
        grid-template-columns: repeat(2, minmax(0, 1fr));
      }

      .controls button,
      .history-controls button {
        grid-column: 1 / -1;
      }

      .metric-grid {
        grid-template-columns: 1fr;
      }
    }

    @media (max-width: 640px) {
      .page {
        width: min(1120px, calc(100% - 64px));
        padding: 30px 0;
      }

      h1,
      .subtitle {
        overflow-wrap: anywhere;
      }

      header {
        margin-bottom: 24px;
        padding-bottom: 20px;
      }

      .feature-header {
        display: grid;
      }

      .badge {
        width: fit-content;
      }

      .controls,
      .controls.history-controls,
      .cards {
        grid-template-columns: 1fr;
      }

      .chart-shell {
        height: 320px;
        padding: 12px;
      }
    }
  </style>
</head>
<body>
  <div class="page">
    <header>
      <h1>Global Economic Explorer</h1>
      <p class="subtitle">Built with Trading Economics API</p>
      <p class="author">by Harsh Pandey</p>
    </header>

    <main>
      <section class="feature" aria-labelledby="compare-heading">
        <div class="feature-header">
          <div class="feature-title">
            <h2 id="compare-heading">Country Comparison</h2>
          </div>
          <div class="badge">Latest data</div>
        </div>

        <div class="controls">
          <label>
            First country
            <select id="compareCountryOne"></select>
          </label>
          <label>
            Second country
            <select id="compareCountryTwo"></select>
          </label>
          <label>
            Indicator
            <select id="compareIndicator"></select>
          </label>
          <button id="compareButton" type="button">Compare</button>
        </div>

        <div id="compareStatus" class="status" aria-live="polite"></div>
        <div id="compareChartShell" class="chart-shell">
          <canvas id="compareChart" role="img" aria-label="Bar chart comparing two countries by selected economic indicator"></canvas>
        </div>
        <div id="comparisonCards" class="cards"></div>
      </section>

      <section class="feature" aria-labelledby="history-heading">
        <div class="feature-header">
          <div class="feature-title">
            <h2 id="history-heading">Historical Trend</h2>
          </div>
          <div class="badge">Time series</div>
        </div>

        <div class="controls history-controls">
          <label>
            Country
            <select id="historyCountry"></select>
          </label>
          <label>
            Indicator
            <select id="historyIndicator"></select>
          </label>
          <button id="historyButton" type="button">Load History</button>
        </div>

        <div id="historyStatus" class="status" aria-live="polite"></div>
        <div id="historyChartShell" class="chart-shell">
          <canvas id="historyChart" role="img" aria-label="Line chart showing historical values for the selected country and indicator"></canvas>
        </div>
      </section>
    </main>
  </div>

  <script>
    const API_BASE_URL = "https://api.tradingeconomics.com";
    const API_KEY = "guest:guest";
    const NO_DATA_MESSAGE = "No data available for this selection";

    const countries = [
      "United States",
      "China",
      "India",
      "Germany",
      "United Kingdom",
      "Japan",
      "Brazil",
      "Mexico",
      "Canada",
      "Australia"
    ];

    const indicators = [
      "GDP Growth Rate",
      "Inflation Rate",
      "Unemployment Rate",
      "Interest Rate"
    ];

    const elements = {
      compareCountryOne: document.getElementById("compareCountryOne"),
      compareCountryTwo: document.getElementById("compareCountryTwo"),
      compareIndicator: document.getElementById("compareIndicator"),
      compareButton: document.getElementById("compareButton"),
      compareStatus: document.getElementById("compareStatus"),
      compareChartShell: document.getElementById("compareChartShell"),
      compareChart: document.getElementById("compareChart"),
      comparisonCards: document.getElementById("comparisonCards"),
      historyCountry: document.getElementById("historyCountry"),
      historyIndicator: document.getElementById("historyIndicator"),
      historyButton: document.getElementById("historyButton"),
      historyStatus: document.getElementById("historyStatus"),
      historyChartShell: document.getElementById("historyChartShell"),
      historyChart: document.getElementById("historyChart")
    };

    let comparisonChart = null;
    let historyChart = null;

    function escapeHtml(value) {
      return String(value)
        .replaceAll("&", "&amp;")
        .replaceAll("<", "&lt;")
        .replaceAll(">", "&gt;")
        .replaceAll('"', "&quot;")
        .replaceAll("'", "&#039;");
    }

    function fillSelect(select, options, selectedValue) {
      const fragment = document.createDocumentFragment();

      options.forEach((option) => {
        const optionElement = document.createElement("option");
        optionElement.value = option;
        optionElement.textContent = option;
        fragment.appendChild(optionElement);
      });

      select.replaceChildren(fragment);
      if (selectedValue) {
        select.value = selectedValue;
      }
    }

    function setStatus(element, message, type = "info") {
      element.classList.toggle("error", type === "error");
      element.replaceChildren();

      if (message instanceof Node) {
        element.appendChild(message);
        return;
      }

      element.textContent = message;
    }

    function loadingText(message) {
      const wrapper = document.createElement("span");
      const spinner = document.createElement("span");

      wrapper.className = "loading";
      spinner.className = "spinner";
      spinner.setAttribute("aria-hidden", "true");

      wrapper.append(spinner, document.createTextNode(message));
      return wrapper;
    }

    function resetShell(shell) {
      shell.classList.remove("visible");
    }

    function showShell(shell) {
      shell.classList.remove("visible");
      void shell.offsetWidth;
      shell.classList.add("visible");
    }

    function waitForChartLayout() {
      return new Promise((resolve) => {
        requestAnimationFrame(() => {
          requestAnimationFrame(resolve);
        });
      });
    }

    async function revealChartShell(shell) {
      showShell(shell);
      await waitForChartLayout();
    }

    function getCanvasContext(canvas) {
      const context = canvas.getContext("2d");
      if (!context) {
        throw new Error("Unable to initialize chart canvas");
      }
      return context;
    }

    function scoreRecordArray(array) {
      const recordFields = new Set([
        "country",
        "countryname",
        "location",
        "latestvalue",
        "previousvalue",
        "value",
        "last",
        "actual",
        "date",
        "datetime",
        "latestvaluedate",
        "lastupdate"
      ]);

      return array.reduce((score, item) => {
        if (!item || typeof item !== "object" || Array.isArray(item)) {
          return score;
        }

        const fieldNames = Object.keys(item).map((key) => String(key).toLowerCase().replace(/[^a-z0-9]/g, ""));
        const hasRecordField = fieldNames.some((fieldName) => recordFields.has(fieldName));
        return score + (hasRecordField ? 3 : 1);
      }, 0);
    }

    function normalizeArray(data) {
      if (Array.isArray(data)) {
        return data;
      }

      if (typeof data === "string") {
        return [];
      }

      if (data && typeof data === "object") {
        const queue = [data];
        const arrays = [];

        while (queue.length > 0) {
          const current = queue.shift();

          if (Array.isArray(current)) {
            arrays.push(current);
            continue;
          }

          if (current && typeof current === "object") {
            queue.push(...Object.values(current));
          }
        }

        const [bestArray] = arrays
          .map((array) => ({ array, score: scoreRecordArray(array) }))
          .sort((a, b) => b.score - a.score);

        if (bestArray && bestArray.score > 0) {
          return bestArray.array;
        }

        if (arrays.length > 0) {
          return arrays[0];
        }

        return [data];
      }

      return [];
    }

    function formatDate(value) {
      if (!value) {
        return "N/A";
      }

      const date = new Date(value);
      if (Number.isNaN(date.getTime())) {
        return String(value);
      }

      return date.toLocaleDateString(undefined, {
        year: "numeric",
        month: "short",
        day: "numeric"
      });
    }

    function formatValue(value) {
      if (value === null || value === undefined || value === "") {
        return "N/A";
      }

      const numericValue = Number(value);
      if (Number.isNaN(numericValue)) {
        return String(value);
      }

      return numericValue.toLocaleString(undefined, {
        maximumFractionDigits: 2
      });
    }

    function getTimestamp(value) {
      const timestamp = new Date(value).getTime();
      return Number.isNaN(timestamp) ? 0 : timestamp;
    }

    function normalizeFieldName(value) {
      return String(value).toLowerCase().replace(/[^a-z0-9]/g, "");
    }

    function getRecordValue(record, keys) {
      if (!record || typeof record !== "object") {
        return null;
      }

      const normalizedRecord = Object.entries(record).reduce((fields, [key, value]) => {
        fields[normalizeFieldName(key)] = value;
        return fields;
      }, {});

      for (const key of keys) {
        const directValue = record[key];
        if (directValue !== undefined && directValue !== null && directValue !== "") {
          return directValue;
        }

        const normalizedValue = normalizedRecord[normalizeFieldName(key)];
        if (normalizedValue !== undefined && normalizedValue !== null && normalizedValue !== "") {
          return normalizedValue;
        }
      }

      return null;
    }

    function getNumber(record, keys) {
      const value = getRecordValue(record, keys);

      if (value === null) {
        return null;
      }

      const numericValue = Number(value);
      if (!Number.isNaN(numericValue)) {
        return numericValue;
      }

      const parsedValue = Number.parseFloat(String(value).replaceAll(",", ""));
      if (!Number.isNaN(parsedValue)) {
        return parsedValue;
      }

      return null;
    }

    function getText(record, keys) {
      const value = getRecordValue(record, keys);
      return value === null ? null : String(value).trim();
    }

    function countryMatches(record, country) {
      const countryValue = getText(record, ["Country", "country", "CountryName", "countryName", "Location", "location"]);
      return countryValue && normalizeFieldName(countryValue) === normalizeFieldName(country);
    }

    function normalizeLatestRecord(record) {
      return {
        country: getText(record, ["Country", "country", "CountryName", "countryName", "Location", "location"]) || "Unknown",
        latest: getNumber(record, ["LatestValue", "latestValue", "Last", "last", "Value", "value", "Actual", "actual"]),
        previous: getNumber(record, ["PreviousValue", "previousValue", "Previous", "previous", "Prior", "prior"]),
        date: getText(record, ["LatestValueDate", "latestValueDate", "LastUpdate", "lastUpdate", "DateTime", "dateTime", "Date", "date", "Updated", "updated"])
      };
    }

    function normalizeHistoryRecord(record) {
      return {
        date: getText(record, ["DateTime", "dateTime", "Date", "date", "LatestValueDate", "latestValueDate"]),
        value: getNumber(record, ["Value", "value", "Last", "last", "LatestValue", "latestValue", "Actual", "actual"])
      };
    }

    function buildComparisonUrl(indicator) {
      return `${API_BASE_URL}/country/indicator/${encodeURIComponent(indicator)}?c=${encodeURIComponent(API_KEY)}`;
    }

    function buildHistoryUrl(country, indicator) {
      return `${API_BASE_URL}/historical/country/${encodeURIComponent(country)}/indicator/${encodeURIComponent(indicator)}?c=${encodeURIComponent(API_KEY)}`;
    }

    function looksLikeApiError(value) {
      const text = String(value || "").toLowerCase();
      return text.includes("guest account")
        || text.includes("discontinued")
        || text.includes("subscribe")
        || text.includes("unauthorized")
        || text.includes("forbidden")
        || text.includes("invalid key")
        || text.includes("authentication")
        || text.includes("<html")
        || text.includes("<p>");
    }

    function parseApiPayload(text) {
      const trimmedText = text.trim();

      if (!trimmedText) {
        return null;
      }

      try {
        return JSON.parse(trimmedText);
      } catch (error) {
        return trimmedText;
      }
    }

    async function fetchJson(url) {
      const response = await fetch(url, {
        headers: {
          Accept: "application/json"
        }
      });
      const rawText = await response.text();
      const payload = parseApiPayload(rawText);

      if (!response.ok) {
        throw new Error(`Request failed with status ${response.status}`);
      }

      if (payload === null || typeof payload === "string" || looksLikeApiError(rawText)) {
        throw new Error("No usable API data");
      }

      return payload;
    }

    function chartOptions(yTitle) {
      return {
        responsive: true,
        maintainAspectRatio: false,
        animation: {
          duration: 520,
          easing: "easeOutQuart"
        },
        interaction: {
          intersect: false,
          mode: "index"
        },
        layout: {
          padding: 4
        },
        plugins: {
          legend: {
            labels: {
              color: "#d8dce7",
              font: {
                family: "Inter"
              }
            }
          },
          tooltip: {
            backgroundColor: "#1a1d27",
            borderColor: "rgba(255, 255, 255, 0.14)",
            borderWidth: 1,
            titleColor: "#ffffff",
            bodyColor: "#d8dce7"
          }
        },
        scales: {
          x: {
            ticks: {
              color: "#aab0bf",
              font: {
                family: "Inter"
              },
              maxRotation: 45,
              minRotation: 0
            },
            grid: {
              color: "rgba(255, 255, 255, 0.06)"
            }
          },
          y: {
            title: {
              display: true,
              text: yTitle,
              color: "#aab0bf",
              font: {
                family: "Inter",
                weight: "600"
              }
            },
            ticks: {
              color: "#aab0bf",
              font: {
                family: "Inter"
              }
            },
            grid: {
              color: "rgba(255, 255, 255, 0.06)"
            }
          }
        }
      };
    }

    function createChart(canvas, config) {
      return new Chart(getCanvasContext(canvas), config);
    }

    function renderComparisonCards(records) {
      elements.comparisonCards.innerHTML = records
        .map((record) => `
          <article class="country-card visible">
            <h3>${escapeHtml(record.country)}</h3>
            <div class="metric-grid">
              <div class="metric">
                <span>Latest Value</span>
                <strong>${escapeHtml(formatValue(record.latest))}</strong>
              </div>
              <div class="metric">
                <span>Previous Value</span>
                <strong>${escapeHtml(formatValue(record.previous))}</strong>
              </div>
              <div class="metric">
                <span>Last Update</span>
                <strong>${escapeHtml(formatDate(record.date))}</strong>
              </div>
            </div>
          </article>
        `)
        .join("");
    }

    async function compareCountries() {
      const countryOne = elements.compareCountryOne.value;
      const countryTwo = elements.compareCountryTwo.value;
      const indicator = elements.compareIndicator.value;
      const url = buildComparisonUrl(indicator);

      elements.compareButton.disabled = true;
      setStatus(elements.compareStatus, loadingText("Fetching comparison data..."));
      resetShell(elements.compareChartShell);
      elements.comparisonCards.innerHTML = "";

      if (comparisonChart) {
        comparisonChart.destroy();
        comparisonChart = null;
      }

      try {
        const data = normalizeArray(await fetchJson(url));
        if (data.length === 0) {
          throw new Error("No data");
        }

        const selectedRecords = [countryOne, countryTwo]
          .map((country) => data.find((record) => countryMatches(record, country)))
          .filter(Boolean)
          .map(normalizeLatestRecord)
          .filter((record) => record.latest !== null);

        if (selectedRecords.length < 2) {
          throw new Error("No data");
        }

        await revealChartShell(elements.compareChartShell);
        comparisonChart = createChart(elements.compareChart, {
          type: "bar",
          data: {
            labels: selectedRecords.map((record) => record.country),
            datasets: [
              {
                label: indicator,
                data: selectedRecords.map((record) => record.latest),
                backgroundColor: ["rgba(0, 212, 170, 0.82)", "rgba(73, 162, 255, 0.82)"],
                borderColor: ["#00d4aa", "#49a2ff"],
                borderWidth: 2,
                borderRadius: 7
              }
            ]
          },
          options: chartOptions("Latest value")
        });

        renderComparisonCards(selectedRecords);
        setStatus(elements.compareStatus, "");
      } catch (error) {
        resetShell(elements.compareChartShell);
        elements.comparisonCards.innerHTML = "";
        if (comparisonChart) {
          comparisonChart.destroy();
          comparisonChart = null;
        }
        setStatus(elements.compareStatus, NO_DATA_MESSAGE, "error");
      } finally {
        elements.compareButton.disabled = false;
      }
    }

    async function loadHistory() {
      const country = elements.historyCountry.value;
      const indicator = elements.historyIndicator.value;
      const url = buildHistoryUrl(country, indicator);

      elements.historyButton.disabled = true;
      setStatus(elements.historyStatus, loadingText("Fetching historical data..."));
      resetShell(elements.historyChartShell);

      if (historyChart) {
        historyChart.destroy();
        historyChart = null;
      }

      try {
        const data = normalizeArray(await fetchJson(url));
        if (data.length === 0) {
          throw new Error("No data");
        }

        const series = data
          .map(normalizeHistoryRecord)
          .filter((record) => record.date && record.value !== null)
          .sort((a, b) => getTimestamp(a.date) - getTimestamp(b.date));

        if (series.length === 0) {
          throw new Error("No data");
        }

        await revealChartShell(elements.historyChartShell);
        historyChart = createChart(elements.historyChart, {
          type: "line",
          data: {
            labels: series.map((record) => formatDate(record.date)),
            datasets: [
              {
                label: `${country} - ${indicator}`,
                data: series.map((record) => record.value),
                borderColor: "#00d4aa",
                backgroundColor: "rgba(0, 212, 170, 0.16)",
                pointBackgroundColor: "#00d4aa",
                pointBorderColor: "#0f1117",
                pointRadius: series.length > 80 ? 0 : 3,
                pointHoverRadius: 5,
                fill: true,
                tension: 0.3
              }
            ]
          },
          options: chartOptions(indicator)
        });

        setStatus(elements.historyStatus, "");
      } catch (error) {
        resetShell(elements.historyChartShell);
        if (historyChart) {
          historyChart.destroy();
          historyChart = null;
        }
        setStatus(elements.historyStatus, NO_DATA_MESSAGE, "error");
      } finally {
        elements.historyButton.disabled = false;
      }
    }

    fillSelect(elements.compareCountryOne, countries, "United States");
    fillSelect(elements.compareCountryTwo, countries, "India");
    fillSelect(elements.historyCountry, countries, "United States");
    fillSelect(elements.compareIndicator, indicators, "GDP Growth Rate");
    fillSelect(elements.historyIndicator, indicators, "Inflation Rate");

    elements.compareButton.addEventListener("click", compareCountries);
    elements.historyButton.addEventListener("click", loadHistory);
  </script>
</body>
</html>
